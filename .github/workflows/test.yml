name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
      - uses: ./
      - run: zig 0.14.1 version
      - name: zig is native to the runner
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64)   want=x86_64 ;;
            ARM64) want=aarch64 ;;
            *) echo "Error: unexpected RUNNER_ARCH '$RUNNER_ARCH'" >&2; exit 1 ;;
          esac
          zig 0.14.1 env | grep "\"target\": \"$want-"
      - name: zig is installed into a cached path
        shell: bash
        run: |
          installs=$(sed -n 2p <<< "$ANYZIG_CACHE_PATHS")
          installs="${installs/#\~/$HOME}"
          ls "$installs/0.14.1" | grep -E '^zig(\.exe)?$'
      - run: zig version
        working-directory: .github/workflows/minversionexample
      - run: zig version
        working-directory: .github/workflows/versionexample
